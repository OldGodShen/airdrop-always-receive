plugins {
    id "com.android.application"
}

android {
    namespace "io.github.oldgodshen.airdropalwaysreceive"
    compileSdk 35

    defaultConfig {
        applicationId "io.github.oldgodshen.airdropalwaysreceive"
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly "de.robv.android.xposed:api:82"
}
